name: Scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SwiftUI source scaffold
        run: python3 scripts/validate-scaffold.py
      - name: Note Mac-only app build
        run: |
          echo "Shore.app cannot be compiled on GitHub-hosted Linux."
          echo "Open Shore.xcodeproj on macOS 14+ with Xcode 16+ / Swift 6."
          echo "Publish dist/Shore-*.dmg from scripts/package-dmg.sh as a GitHub Release asset."
